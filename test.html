<!doctype html>
<meta charset="utf-8">
<title>upload-fit 브라우저 테스트</title>
<!-- content script 흉내: document_start처럼 페이지 스크립트보다 먼저 로드한다 -->
<script src="spec.js"></script>
<script src="convert.js"></script>
<script src="content.js"></script>
<body>
<pre id="out">running</pre>
<script>
// 실행: CLAUDE.md의 "브라우저 테스트" 명령 (headless Chrome이 결과를 #out에 찍는다)
const results = [];
const check = (name, ok, detail = '') => results.push(`${ok ? 'ok' : 'not ok'} - ${name}${ok ? '' : ` :: ${detail}`}`);
const settle = () => new Promise(r => setTimeout(r, 50));
const file = (name, type = 'image/png') => new File(['x'], name, { type });

// 사용자가 파일을 고른 것처럼: files를 채우고 input → change 순서로 쏜다. 쏜 이벤트 객체를 돌려준다.
function pick(input, files) {
  const dt = new DataTransfer();
  files.forEach(f => dt.items.add(f));
  input.files = dt.files;
  const sent = [new Event('input', { bubbles: true, composed: true }), new Event('change', { bubbles: true })];
  sent.forEach(e => input.dispatchEvent(e));
  return sent;
}

function fileInput(attrs = {}) {
  const input = Object.assign(document.createElement('input'), { type: 'file', ...attrs });
  document.body.append(input);
  const seen = { input: 0, change: 0, names: [], events: [] };
  input.addEventListener('input', e => { seen.input++; seen.events.push(e); });
  input.addEventListener('change', e => { seen.change++; seen.events.push(e); seen.names = [...input.files].map(f => f.name); });
  return { input, seen };
}

// 페이지가 받은 이벤트가 원래 쏜 것과 다른 객체면 = 가로채서 다시 쏜 것
const replayed = (sent, seen) => seen.events.length > 0 && seen.events.every(e => !sent.includes(e));

const tests = {
  async '패스스루: 페이지 핸들러가 input·change 한 번씩, 같은 파일로 호출된다'(name) {
    const { input, seen } = fileInput();
    const sent = pick(input, [file('a.png')]);
    await settle();
    const ok = replayed(sent, seen) && seen.input === 1 && seen.change === 1 && seen.names.join() === 'a.png';
    check(name, ok, JSON.stringify({ replayed: replayed(sent, seen), input: seen.input, change: seen.change, names: seen.names }));
  },
  async 'multiple: 여러 파일의 순서가 유지된다'(name) {
    const { input, seen } = fileInput({ multiple: true });
    pick(input, ['1.png', '2.jpg', '3.png'].map(n => file(n)));
    await settle();
    check(name, seen.change === 1 && seen.names.join() === '1.png,2.jpg,3.png', JSON.stringify(seen));
  },
  async '파일 없는 change는 손대지 않고 바로 통과한다'(name) {
    const { input, seen } = fileInput();
    input.dispatchEvent(new Event('change', { bubbles: true }));
    check(name, seen.change === 1, JSON.stringify(seen)); // 동기로 이미 도착해 있어야 한다
  },
  async '파일 input이 아닌 change는 손대지 않는다'(name) {
    const text = Object.assign(document.createElement('input'), { type: 'text' });
    document.body.append(text);
    let n = 0;
    text.addEventListener('change', () => n++);
    text.dispatchEvent(new Event('change', { bubbles: true }));
    check(name, n === 1, `n=${n}`);
  },

  // ── 3단계: 규격 위치 찾기 ──
  async 'Play 구조: 휴대전화 "애셋 추가" → 패널 "업로드" → 휴대전화 규격'(name) {
    const play = playFixture();
    recentClicks.length = 0;
    play.addButtons.phone.click();
    play.uploadButton.click();
    const spec = findSpec(play.input);
    check(name, spec && spec.minSide === 320 && spec.maxSide === 3840 && spec.maxBytes === 8e6, JSON.stringify(spec));
    play.root.remove();
  },
  async 'Play 구조: 같은 패널 input이라도 아이콘 "애셋 추가" 뒤면 아이콘 규격'(name) {
    const play = playFixture();
    recentClicks.length = 0;
    play.addButtons.icon.click();
    play.uploadButton.click();
    const spec = findSpec(play.input);
    check(name, spec && JSON.stringify(spec.sizes) === '[[512,512]]' && spec.maxBytes === 1e6, JSON.stringify(spec));
    play.root.remove();
  },
  async 'Play 구조: 패널 "업로드"만 누르면 null — 패널 메타데이터(1080x1920px)에 속지 않는다'(name) {
    const play = playFixture();
    recentClicks.length = 0;
    play.uploadButton.click();
    const spec = findSpec(play.input);
    check(name, spec === null, JSON.stringify(spec));
    play.root.remove();
  },
  async '평범한 폼: 클릭 기록이 없어도 label 안 안내문을 찾는다'(name) {
    const root = fixture(`<form><label>사진 등록 <input type="file"> <small>※ 사진 파일은 JPG 또는 GIF 형식만 가능합니다.<br>※ 가로(120px), 세로(160px) 사이즈로 등록해 주세요.</small></label></form>`);
    recentClicks.length = 0;
    const spec = findSpec(root.querySelector('input'));
    check(name, spec && JSON.stringify(spec.sizes) === '[[120,160]]' && spec.formats.join() === 'gif,jpeg', JSON.stringify(spec));
    root.remove();
  },
  async 'aria-describedby로 멀리 떨어진 안내문을 찾는다'(name) {
    const root = fixture(`<div><p id="hint">파일 크기 500KB 이하, 파일 형식 JPG/JPEG</p></div><div><div><input type="file" aria-describedby="hint"></div></div>`);
    recentClicks.length = 0;
    const spec = findSpec(root.querySelector('input'));
    check(name, spec && spec.maxBytes === 5e5, JSON.stringify(spec));
    root.remove();
  },

  // ── 4단계: 변환 ──
  async 'Play 휴대전화: 1080×2340 PNG 캡처 → 1080×1920 JPEG, 8MB 이하'(name) {
    const out = await convert(await image(1080, 2340), parseSpec(PLAY_PHONE));
    const [w, h] = await dims(out);
    check(name, w === 1080 && h === 1920 && out.type === 'image/jpeg' && out.size <= 8e6 && out.name === 'img.jpg', JSON.stringify({ w, h, type: out.type, size: out.size, fileName: out.name }));
  },
  async 'Play 앱 아이콘: 투명 PNG는 PNG로 512×512'(name) {
    const out = await convert(await image(1000, 1000, { alpha: true }), parseSpec(PLAY_ICON));
    const [w, h] = await dims(out);
    check(name, w === 512 && h === 512 && out.type === 'image/png' && out.size <= 1e6, JSON.stringify({ w, h, type: out.type, size: out.size }));
  },
  async 'Q-Net 200KB 이하: 노이즈 사진(최악의 압축)도 품질·크기를 줄여 맞춘다, 3:4 유지'(name) {
    const spec = parseSpec(QNET_GUIDE);
    const out = await convert(await image(1500, 2000, { noise: true }), spec);
    const [w, h] = await dims(out);
    check(name, out.size <= 200000 && out.type === 'image/jpeg' && Math.abs(w / h - 3 / 4) < 0.01, JSON.stringify({ w, h, type: out.type, size: out.size }));
  },
  async '여권: 노이즈 3000×4000 → 413×531 JPEG, 500KB 이하'(name) {
    const out = await convert(await image(3000, 4000, { noise: true }), parseSpec(PASSPORT));
    const [w, h] = await dims(out);
    check(name, w === 413 && h === 531 && out.type === 'image/jpeg' && out.size <= 500000, JSON.stringify({ w, h, type: out.type, size: out.size }));
  },
  async '이미지가 아닌 파일(PDF)은 그대로 돌려준다'(name) {
    const pdf = new File(['%PDF-1.4'], 'doc.pdf', { type: 'application/pdf' });
    check(name, (await convert(pdf, parseSpec(PLAY_PHONE))) === pdf);
  },
};

// 실제 안내문 원문 (spec.test.js와 같은 출처)
const PLAY_PHONE = '휴대전화 스크린샷을 2~8장 업로드하세요. 스크린샷은 PNG 또는 JPEG, 장당 최대 8MB, 가로세로 비율 16:9 또는 9:16, 가로세로 길이는 320px X 3840px 사이여야 합니다.';
const PLAY_ICON = '앱 아이콘은 PNG 또는 JPEG, 최대 1MB, 512 x 512px이어야 하며 디자인 사양 및 메타데이터 정책을 준수해야 합니다.';
const QNET_GUIDE = '1. 증명사진(2.5X3.5) 또는 반명함판(3X4) 사진을 준비하시기 바랍니다.\n· 파일형식 : *.JPG 또는 *.JPEG\n· 파일용량 : 200KB 이하';
const PASSPORT = '파일 크기 500KB 이하, 파일 형식 JPG/JPEG\n가로 413 픽셀(pixel), 세로 531 픽셀 사이즈 권장(가로 395~431 픽셀, 세로 507~550 픽셀 이내만 업로드 가능) ';

// 테스트용 이미지: 단색 그라데이션, alpha면 가운데를 투명하게, noise면 무작위 픽셀 (압축 최악)
async function image(w, h, { alpha = false, noise = false } = {}) {
  const c = new OffscreenCanvas(w, h);
  const ctx = c.getContext('2d');
  if (noise) {
    const d = ctx.createImageData(w, h);
    const buf = new Uint32Array(d.data.buffer);
    for (let i = 0; i < buf.length; i++) buf[i] = (Math.random() * 0xffffff) | 0xff000000;
    ctx.putImageData(d, 0, 0);
  } else {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#3366cc');
    g.addColorStop(1, '#cc6633');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (alpha) ctx.clearRect(w / 4, h / 4, w / 2, h / 2);
  }
  return new File([await c.convertToBlob({ type: 'image/png' })], 'img.png', { type: 'image/png' });
}

async function dims(file) {
  const b = await createImageBitmap(file);
  return [b.width, b.height];
}

function fixture(html) {
  const root = document.createElement('div');
  root.innerHTML = html;
  document.body.append(root);
  return root;
}

// Play Console 기본 스토어 등록정보 구조 재현: 슬롯마다 규격 문구 + "애셋 추가", 공용 애셋 패널 안에 input 하나.
// 문구는 실제 화면 원문 (2026-10-22).
function playFixture() {
  const slot = (key, title, text) => `<section data-slot="${key}"><h3>${title}</h3><p>${text}</p><div class="assets"><div><button type="button">애셋 추가</button></div></div></section>`;
  const root = fixture(`
    <main>
      ${slot('icon', '앱 아이콘', '앱 아이콘은 PNG 또는 JPEG, 최대 1MB, 512 x 512px이어야 하며 디자인 사양 및 메타데이터 정책을 준수해야 합니다.')}
      ${slot('feature', '그래픽 이미지', '그래픽 이미지는 PNG 또는 JPEG, 최대 15MB, 1,024px X 500px이어야 합니다. 앱을 추천하도록 선택하면 이 이미지가 사용됩니다. 자세히 알아보기')}
      ${slot('phone', '휴대전화 스크린샷', '휴대전화 스크린샷을 2~8장 업로드하세요. 스크린샷은 PNG 또는 JPEG, 장당 최대 8MB, 가로세로 비율 16:9 또는 9:16, 가로세로 길이는 320px X 3840px 사이여야 합니다.')}
    </main>
    <aside class="asset-library">
      <div class="list"><div>선택 취소됨 애셋 07.png</div><div>07.png</div><div>9∶16 </div><div>가로세로 비율: 9∶16</div><div>1080x1920px </div><div>크기: 1080x1920px</div><div>2026년 10월 19일</div><div>업로드 날짜: 2026년 10월 19일</div></div>
      <div class="bottom-bar"><simple-uploader><button type="button">업로드</button><input type="file" multiple accept=".jpeg,.jpg,.png" style="display:none"></simple-uploader></div>
    </aside>`);
  const [icon, feature, phone] = [...root.querySelectorAll('main button')];
  return { root, addButtons: { icon, feature, phone }, uploadButton: root.querySelector('aside button'), input: root.querySelector('aside input') };
}

(async () => {
  for (const [name, fn] of Object.entries(tests)) {
    try { await fn(name); } catch (e) { check(name, false, e.stack); }
  }
  const pass = results.filter(r => r.startsWith('ok')).length;
  document.getElementById('out').textContent = `${results.join('\n')}\n# ${pass}/${results.length} passed`;
})();
</script>
